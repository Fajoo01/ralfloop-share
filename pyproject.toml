[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ralfloop-agent"
version = "0.1.0"
description = "Minimal scaffold for the Ralfloop OpenShell agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
teacher-web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
ralf = "ralfloop_agent.cli.terminal_chat:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ralfloop_agent*"]

[tool.setuptools.package-data]
"ralfloop_agent.teacher.web" = ["curriculum.json", "migrations/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires explicitly installed local services"]
