name: Epson Gmail draft contract
on:
  push:
    branches:
      - fix/epson-gmail-draft-20261125
jobs:
  offline:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Test draft-only contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_scanner_email_draft_stdlib.py' -v
          python3 -m unittest discover -s tests -p 'test_photo_email_draft_stdlib.py' -v
          python3 -m py_compile openshell_backend/scanner_email_draft.py openshell_backend/manual_email_draft.py
