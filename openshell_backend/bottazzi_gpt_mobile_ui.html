<style>

.detail{display:none}.detail-head{position:sticky;top:0}.messages{padding:12px 8px calc(102px + env(safe-area-inset-bottom));min-height:calc(100% - 64px);background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.018) 0 1px,transparent 1px),radial-gradient(circle at 80% 70%,rgba(255,255,255,.014) 0 1px,transparent 1px);background-size:24px 24px,32px 32px}.msg{display:flex;margin:8px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:9px 11px;border:1px solid #2e3531;border-radius:8px 8px 8px 2px;background:var(--panel);line-height:1.46;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px #0005;font-size:14px}.user .bubble{background:var(--mine);border-color:#50342a;border-radius:8px 8px 2px 8px}.bubbletools{text-align:right;margin-top:5px}.tiny{border:0;background:transparent;font-size:17px;color:#b7beb9;padding:2px 4px}.working{display:flex;align-items:center;gap:8px;color:#cbd2cd;font-size:13px}.dots{display:inline-flex;gap:4px}.dots i{display:block;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;animation:dot 1.05s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.14s}.dots i:nth-child(3){animation-delay:.28s}@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-3px);opacity:1}}.goal{margin:8px 0;padding:8px 10px;border:1px solid #49633f;background:#1c291b;border-radius:9px;color:#bed9b7;font-size:11px}.errbox{margin:8px 0;padding:9px 11px;border:1px solid #713730;background:#2d1d1a;border-radius:9px;color:#f1c3bd;font-size:12px}

.archive,.projects,.more{padding-bottom:90px}.toolbar{padding:10px;display:grid;gap:8px}.toolbar input,.toolbar select{width:100%;border:1px solid #3a423d;background:#181c1a;border-radius:10px;padding:10px}.card{margin:8px 10px;padding:11px;background:#181c1a;border:1px solid var(--line);border-radius:12px}.card b{display:block}.card .sub{margin-top:4px}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:1px solid #414945;background:var(--panel2);border-radius:9px;padding:9px 11px}.primary{background:#6d2a23;border-color:#9a4035}.shade{position:fixed;inset:0;background:#0009;z-index:30;display:none}.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--bar);border-radius:18px;padding:12px}.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sheet button{border:0;background:#2a302d;border-radius:14px;padding:16px 6px;font-size:13px}.sheet button span{display:block;font-size:26px;margin-bottom:7px}.modalback{position:fixed;inset:0;background:#000a;z-index:40;display:none;place-items:center;padding:15px}.modal{width:min(520px,100%);background:var(--bar);border-radius:18px;padding:16px}.modal input,.modal textarea,.modal select{width:100%;border:1px solid #3a423d;background:#111412;border-radius:11px;padding:11px;margin:5px 0;font-size:16px}.modal textarea{min-height:110px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.menu{position:fixed;right:8px;top:calc(58px + env(safe-area-inset-top));z-index:22;display:none;min-width:210px;overflow:hidden;background:var(--bar);border-radius:12px;box-shadow:0 8px 30px #000a}.menu button{width:100%;border:0;background:transparent;text-align:left;padding:13px 15px}.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:none;max-width:90%;background:#2a302d;border-radius:9px;padding:9px 12px;font-size:13px}input[type=file]{display:none}@media(min-width:760px){.app{max-width:760px;margin <body data-app-gateway="1"><div hidden aria-hidden="true"><strong>Bot-tazzi</strong><span>Peppone · Assistente autonomo locale</span><h1>Bot-tazzi</h1><span>Scrivi a Bot-tazzi</span></div><div class="app"><header class="top" id="homeTop"><div class="logo">P</div><div class="grow"><div class="title">Bot-tazzi</div><div class="sub" id="homeStatus">GPT · lavora fino al GOAL</div></div><button class="icon" id="searchToggle">⌕</button><button class="icon" id="menuBtn">⋮</button></header><div class="view"><section class="screen home" id="home"><div class="search" id="searchBar" hidden><input id="searchInput" placeholder="Cerca chat"></div><div class="section-head"><h2>Chat</h2><span id="chatCount"></span></div><div class="chatlist" id="chatList"></div></section><section class="screen detail" id="detail"><header class="detail-head"><button class="icon" id="backBtn">←</button><div class="avatar">P</div><div class="grow"><div class="title" id="detailTitle">Chat</div><div class="sub" id="detailStatus"></div></div><button class="icon" id="detailMenu">⋮</button></header><div class="messages" id="messages"></div><div class="attachchip" id="attachChip" hidden></div><div class="feedback" id="feedback"></div><div class="composerbar"><div class="composerbox"><button class="icon" id="attachBtn" type="button">＋</button><textarea id="composer" rows="1" placeholder="Scrivi a Bot-tazzi…"></textarea></div><button class="sendmic" id="sendMic" type="button" title="Tieni premuto per parlare">🎙</button></div></section><section class="screen archive hidden" id="archive"><div class="section-head"><h2>Archivio</h2></div><div class="toolbar"><input id="archiveSearch" placeholder="Cerca nello storico"><select id="archiveProject"><option value="">Tutti i progetti</option><option value="__none__">Senza progetto</option></select><button class="btn" id="archiveRefresh">Aggiorna archivio</button></div><div id="archiveStatus" class="card sub">Ricerca per titolo.</div><div id="archiveList"></div><button class="btn" id="archiveMore" hidden>Carica altre chat</button></section><section class="screen projects hidden" id="projects"><div class="section-head"><h2>Progetti</h2></div><div id="projectList"></div></section><section class="screen more hidden" id="more"><div class="section-head"><h2>Altro</h2></div><div id="systemCard" class="card"><b>Bot-tazzi GPT</b><div class="sub">Controlli tecnici e stato del browser.</div></div><div class="card-actions" style="padding:0 10px"><button class="btn" id="refreshBtn">Aggiorna</button><button class="btn" id="importBtn">Chat da importare</button><button class="btn" id="logoutBtn">Esci</button></div><div id="externalList"></div></section></div><button class="fab" id="newBtn">＋</button><nav class="bottomnav" id="bottomNav"><button class="nav active" data-tab="home"><b>◉</b>Chat</button><button class="nav" data-tab="archive"><b>⌕</b>Archivio</button><button class="nav" data-tab="projects"><b>▦</b>Progetti</button><button class="nav" data-tab="more"><b>⋯</b>Altro</button></nav></div>
<div class="menu" id="menu"><button data-tab="archive">Archivio</button><button data-tab="projects">Progetti</button><button data-tab="more">Altro</button></div><div class="shade" id="attachSheet"><div class="sheet"><h3>Allega</h3><div class="sheetgrid"><button id="cameraBtn"><span>📷</span>Fotocamera</button><button id="photoBtn"><span>🖼️</span>Foto</button><button id="fileBtn"><span>📄</span>File</button></div></div></div><input id="cameraInput" type="file" accept="image/*" capture="environment"><input id="photoInput" type="file" accept="image/*"><input id="fileInput" type="file" accept="image/*,application/pdf,text/plain,text/csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx"><input id="voiceInput" type="file" accept="audio/*" capture><div class="modalback" id="newModal"><form class="modal" id="newForm"><h2>Nuova chat</h2><input id="newTitle" maxlength="300" placeholder="Titolo" required><select id="newProject"><option value="">Senza progetto</option></select><textarea id="newPrompt" maxlength="32000" placeholder="Cosa deve portare a termine Bot-tazzi" required></textarea><div class="actions"><button type="button" class="btn" id="newCancel">Annulla</button><button class="btn primary">Avvia</button></div></form></div><div class="toast" id="toast"></div>
<script>
function rootPrefix(){const p=location.pathname,m='/assistant/v1',i=p.indexOf(m);return i>=0?p.slice(0,i):''}const ROOT=rootPrefix(),GPT=`${ROOT}/assistant/v1/gpt`,$=s=>document.querySelector(s);const state={snap:null,current:null,search:'',recording:null,press:null,pending:new Map(),history:[],projects:[],next:'',speaking:false};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v||'').replace(/\s+/g,' ').trim();function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2400)}async function gpt(path='',opt={}){const r=await fetch(GPT+(path?'/'+path:''),opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.detail||j.error||`HTTP ${r.status}`);return j}function humanError(v){const s=String(v||'');if(/tool_runtime_error/i.test(s))return 'Uno strumento ha avuto un problema temporaneo. Bot-tazzi riprova.';if(/timeout|WebSocket|cdp_/i.test(s))return 'Connessione alla chat temporaneamente lenta. Bot-tazzi riprova automaticamente.';return s}function status(j){if(j.last_error==='goal_blocked')return['Bloccato','err'];if(j.live_busy)return['Sta lavorando','live'];if(['queued','starting'].includes(j.state))return['In coda','warn'];if(j.state==='review'&&!j.last_error)return['GOAL raggiunto','live'];if(j.last_error)return['Attenzione','err'];return[j.state||'chat','']}function preview(j){return clean(j.live_assistant_text||j.last_assistant_text||j.prompt||'Tocca per aprire').slice(0,96)}
function jobs(){return[...(state.snap?.jobs||[])].sort((a,b)=>Number(a.rank)-Number(b.rank))}function renderHome(){const q=state.search.toLowerCase(),rows=jobs().filter(j=>!q||(`${j.title} ${preview(j)}`).toLowerCase().includes(q));let h='';for(const j of rows){const[s,c]=status(j);h+=`<div class="chatrow" data-job="${j.job_id}"><div class="avatar">P</div><div><div class="ctitle">${esc(j.title)}</div><div class="preview">${j.live_busy?'● ':''}${esc(preview(j))}</div></div><div class="side"><span>#${j.rank}</span><span class="badge ${c}">${esc(s)}</span></div></div>`}$('#chatList').innerHTML=h||'<div class="empty"><b>Nessuna chat</b>Premi ＋ per creare un lavoro.</div>';$('#chatCount').textContent=rows.length?`${rows.length} lavori`:'';$('#homeStatus').textContent='GPT · lavora fino al GOAL'}function job(){return jobs().find(j=>j.job_id===state.current)}function localMsgs(id){try{return JSON.parse(localStorage.getItem('bottazzi.gpt.'+id)||'[]')}catch{return[]}}function saveMsgs(id,m){localStorage.setItem('bottazzi.gpt.'+id,JSON.stringify(m.slice(-50)))}
function renderDetail(){const j=job();if(!j)return showTab('home');const[s]=status(j);$('#detailTitle').textContent=j.title;$('#detailStatus').textContent=s+(j.project_name?' · '+j.project_name:'');const local=localMsgs(j.job_id),answer=String(j.live_assistant_text||j.last_assistant_text||'').trim();let h='';for(const m of local)h+=`<div class="msg ${m.role}"><div class="bubble">${esc(m.text)}${m.role==='assistant'?`<div class="bubbletools"><button class="tiny" data-speak="${encodeURIComponent(m.text)}">🔊</button></div>`:''}</div></div>`;if(answer&&!local.some(m=>m.role==='assistant'&&m.text===answer))h+=`<div class="msg assistant"><div class="bubble">${esc(answer)}<div class="bubbletools"><button class="tiny" data-speak="${encodeURIComponent(answer)}">🔊</button></div></div></div>`;if(j.live_busy)h+='<div class="msg assistant"><div class="bubble"><span class="working">Bot-tazzi sta lavorando <span class="dots"><i></i><i></i><i></i></span></span></div></div>';if(j.last_error)h+=`<div class="errbox">${esc(humanError(j.last_error))}</div>`;if(j.state==='review'&&!j.last_error&&!j.live_busy&&answer)h+='<div class="goal">GOAL raggiunto. Lavoro completato.</div>';$('#messages').innerHTML=h||'<div class="empty"><b>Chat pronta</b>Scrivi o tieni premuto 🎙.</div>';const a=state.pending.get(j.job_id);$('#attachChip').hidden=!a;$('#attachChip').textContent=a?'📎 Allegato pronto: '+a:'';$('#feedback').textContent=a?'Premi invia quando vuoi.':'';$('#sendMic').textContent=($('#composer').value.trim()||a)?'➤':'🎙';requestAnimationFrame(()=>$('#messages').scrollTop=$('#messages').scrollHeight)}function openJob(id){state.current=id;$('#homeTop').style.display='none';$('#bottomNav').classList.add('hidden');$('#newBtn').classList.add('hidden');for(const x of ['home','archive','projects','more'])$('#'+x).classList.add('hidden');$('#detail').style.display='block';renderDetail()}function closeDetail(){state.current=null;$('#detail').style.display='none';$('#homeTop').style.display='flex';$('#bottomNav').classList.remove('hidden');$('#newBtn').classList.remove('hidden');showTab('home')}
function showTab(tab){if(state.current)return;for(const x of ['home','archive','projects','more'])$('#'+x).classList.toggle('hidden',x!==tab);document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#newBtn').classList.toggle('hidden',tab!=='home');$('#menu').style.display='none';if(tab==='home')renderHome();if(tab==='archive')loadHistory();if(tab==='projects')loadHistory();if(tab==='more')renderMore()}async function refresh(){if(state.recording)return;try{state.snap=await gpt();state.current?renderDetail():renderHome();renderMore()}catch(e){toast('GPT non raggiungibile: '+humanError(e.message))}}
async function send(){const j=job();if(!j)return;const b=$('#composer'),att=state.pending.get(j.job_id),typed=b.value.trim(),text=typed||(att?'Analizza questo allegato.':'');if(!text)return;b.value='';const m=localMsgs(j.job_id);m.push({role:'user',text:(att?'📎 '+att+(typed?' · ':''):'')+text});saveMsgs(j.job_id,m);state.pending.delete(j.job_id);renderDetail();try{await gpt(`jobs/${j.job_id}/message`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});toast('Inviato · GPT sta lavorando');await refresh()}catch(e){toast('Invio non riuscito: '+humanError(e.message))}}async function upload(file,image=false){const j=job();if(!j||!file)return;toast('Allego '+file.name+'…');try{await gpt(`jobs/${j.job_id}/attachment`,{method:'POST',headers:{'content-type':file.type||'application/octet-stream','x-bottazzi-file-name':encodeURIComponent(file.name),'x-bottazzi-image':image?'1':'0'},body:file});state.pending.set(j.job_id,file.name);renderDetail();toast('Allegato pronto · non inviato')}catch(e){toast('Allegato non riuscito: '+humanError(e.message))}}
async function voiceBlob(blob,type){try{toast('Trascrivo…');const z=await gpt('audio/transcribe',{method:'POST',headers:{'content-type':type||'audio/webm'},body:blob});$('#composer').value=String(z.text||'').trim();await send()}catch(e){toast('Vocale non inviato: '+humanError(e.message))}}async function startMic(e){const j=job();if(!j||state.recording||state.press)return;e.preventDefault();const p={pointer:e.pointerId,released:false};state.press=p;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){state.press=null;$('#voiceInput').click();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm',r=new MediaRecorder(stream,{mimeType:mime}),chunks=[];r.ondataavailable=x=>{if(x.data?.size)chunks.push(x.data)};r.onstop=()=>{stream.getTracks().forEach(t=>t.stop());state.recording=null;$('#sendMic').classList.remove('recording');$('#sendMic').textContent='🎙';voiceBlob(new Blob(chunks,{type:r.mimeType||'audio/webm'}),r.mimeType)};state.press=null;state.recording={r,pointer:e.pointerId};$('#sendMic').classList.add('recording');$('#sendMic').textContent='●';$('#feedback').textContent='Registrazione… rilascia per inviare';try{$('#sendMic').setPointerCapture(e.pointerId)}catch{}r.start();if(p.released)r.stop()}catch(e){state.press=null;toast('Microfono non disponibile')}}function stopMic(e){if(state.press){state.press.released=true;return}const r=state.recording;if(!r)return;if(e.pointerId!==undefined&&r.pointer!==e.pointerId)return;e.preventDefault();if(r.r.state!=='inactive')r.r.stop()}function speak(t){if(state.speaking){try{window.BotTazziNative?.stop?.();speechSynthesis?.cancel?.()}catch{}state.speaking=false;return}state.speaking=true;if(window.BotTazziNative?.speak){window.BotTazziNative.speak(t);setTimeout(()=>state.speaking=false,1200);return}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.onend=()=>state.speaking=false;speechSynthesis.speak(u)}}
async function loadHistory(append=false){try{const p=new URLSearchParams({query:$('#archiveSearch').value.trim(),project_id:$('#archiveProject').value,cursor:append?state.next:''}),h=await gpt('history?'+p);const map=new Map((append?state.history:[]).map(r=>[r.conversation_url,r]));for(const r of h.chats||[])map.set(r.conversation_url,r);state.history=[...map.values()];state.projects=h.projects||[];state.next=h.next_cursor||'';renderArchive();renderProjects();fillProjectSelect();$('#archiveStatus').textContent=h.error?'Storico temporaneamente incompleto.':'Ricerca per titolo.'}catch(e){$('#archiveStatus').textContent=humanError(e.message)}}function renderArchive(){$('#archiveList').innerHTML=state.history.map((r,i)=>`<div class="card" data-history="${i}"><b>${esc(r.title||'Chat GPT')}</b><div class="sub">${esc(r.project_name||'')}</div></div>`).join('')||'<div class="empty">Nessuna chat.</div>';$('#archiveMore').hidden=!state.next}function renderProjects(){$('#projectList').innerHTML=state.projects.map((p,i)=>`<div class="card"><b>${esc(p.title)}</b><div class="sub">Progetto ChatGPT</div><div class="card-actions"><button class="btn" data-project-history="${i}">Chat</button><button class="btn primary" data-project-new="${i}">Nuovo lavoro</button></div></div>`).join('')||'<div class="empty">Nessun progetto disponibile.</div>'}function fillProjectSelect(){const s=$('#newProject');s.innerHTML='<option value="">Senza progetto</option>'+state.projects.map((p,i)=>`<option value="${i}">${esc(p.title)}</option>`).join('')}function renderMore(){const ext=(state.snap?.browser?.open_chats||[]).filter(r=>!r.managed);$('#systemCard').innerHTML=`<b>Bot-tazzi GPT</b><div class="sub">${jobs().length} lavori · ${ext.length} chat esterne · continuazione automatica fino al GOAL.</div>`;$('#externalList').innerHTML=ext.map(r=>`<div class="card" data-import="${esc(r.target_id)}"><b>${esc(r.title||'Chat ChatGPT')}</b><div class="sub">Tocca per importare nella coda</div></div>`).join('')}
$('#chatList').onclick=e=>{const r=e.target.closest('[data-job]');if(r)openJob(r.dataset.job)};$('#backBtn').onclick=closeDetail;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('#newBtn').onclick=()=>{$('#newModal').style.display='grid';$('#newTitle').focus()};$('#newCancel').onclick=()=>$('#newModal').style.display='none';$('#newForm').onsubmit=async e=>{e.preventDefault();const title=$('#newTitle').value.trim(),prompt=$('#newPrompt').value.trim(),idx=$('#newProject').value,p=idx===''?null:state.projects[Number(idx)];if(!title||!prompt)return;$('#newModal').style.display='none';try{const z=await gpt('jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,prompt,project_name:p?.title||'',project_url:p?.url||null,auto_start:true})});$('#newTitle').value='';$('#newPrompt').value='';await refresh();if(z.job?.job_id)openJob(z.job.job_id)}catch(e){toast('Creazione non riuscita: '+humanError(e.message))}};$('#searchToggle').onclick=()=>{$('#searchBar').hidden=!$('#searchBar').hidden;if(!$('#searchBar').hidden)$('#searchInput').focus()};$('#searchInput').oninput=e=>{state.search=e.target.value;renderHome()};$('#menuBtn').onclick=()=>$('#menu').style.display=$('#menu').style.display==='block'?'none':'block';$('#refreshBtn').onclick=refresh;$('#importBtn').onclick=()=>{showTab('more');toast('Le chat esterne sono qui sotto')};$('#logoutBtn').onclick=async()=>{await fetch(`${ROOT}/logout`,{method:'POST'});location.reload()};$('#detailMenu').onclick=()=>{const j=job();if(j&&confirm('Segnare manualmente come fatto?'))gpt(`jobs/${j.job_id}/state`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:'done'})}).then(()=>{closeDetail();refresh()}).catch(e=>toast(humanError(e.message)))};
$('#attachBtn').onclick=()=>$('#attachSheet').style.display='block';$('#attachSheet').onclick=e=>{if(e.target===$('#attachSheet'))$('#attachSheet').style.display='none'};$('#cameraBtn').onclick=()=>{$('#attachSheet').style.display='none';$('#cameraInput').click()};$('#photoBtn').onclick=()=>{$('#attachSheet').style.display='none';$('#photoInput').click()};$('#fileBtn').onclick=()=>{$('#attachSheet').style.display='none';$('#fileInput').click()};for(const [id,img] of [['#cameraInput',true],['#photoInput',true],['#fileInput',false]])$(id).onchange=e=>{const f=e.target.files?.[0];e.target.value='';if(f)upload(f,img)};$('#voiceInput').onchange=e=>{const f=e.target.files?.[0];e.target.value='';if(f)voiceBlob(f,f.type)};$('#composer').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,112)+'px';$('#sendMic').textContent=(e.target.value.trim()||state.pending.get(state.current))?'➤':'🎙'};$('#sendMic').onclick=()=>{if($('#composer').value.trim()||state.pending.get(state.current))send()};$('#sendMic').addEventListener('pointerdown',e=>{if(!$('#composer').value.trim()&&!state.pending.get(state.current))startMic(e)});document.addEventListener('pointerup',stopMic);document.addEventListener('pointercancel',stopMic);document.addEventListener('contextmenu',e=>{if(e.target===$('#sendMic'))e.preventDefault()});$('#messages').onclick=e=>{const b=e.target.closest('[data-speak]');if(b)speak(decodeURIComponent(b.dataset.speak))};$('#archiveRefresh').onclick=()=>loadHistory();$('#archiveMore').onclick=()=>loadHistory(true);let st;$('#archiveSearch').oninput=()=>{clearTimeout(st);st=setTimeout(()=>loadHistory(),350)};$('#archiveProject').onchange=()=>loadHistory();$('#archiveList').onclick=async e=>{const r=e.target.closest('[data-history]');if(!r)return;const x=state.history[Number(r.dataset.history)];try{const z=await gpt('history/resume',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({conversation_url:x.conversation_url,conversation_context_url:x.conversation_context_url||x.conversation_url,title:x.title||'Chat GPT',project_name:x.project_name||'',project_url:x.project_url||null})});await refresh();openJob(z.job.job_id)}catch(e){toast(humanError(e.message))}};$('#projectList').onclick=e=>{const h=e.target.closest('[data-project-history]'),n=e.target.closest('[data-project-new]');if(h){const p=state.projects[Number(h.dataset.projectHistory)];$('#archiveProject').value=p.project_id||'';showTab('archive');loadHistory()}if(n){$('#newProject').value=n.dataset.projectNew;$('#newModal').style.display='grid'}};$('#externalList').onclick=async e=>{const r=e.target.closest('[data-import]');if(!r)return;try{const z=await gpt('jobs/import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({target_id:r.dataset.import})});await refresh();openJob(z.job.job_id)}catch(e){toast('Import non riuscito: '+humanError(e.message))}};
