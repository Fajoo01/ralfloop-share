<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b21"><title>GPT Browser — Tiremm</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0b141a;--bar:#202c33;--line:#233138;--ink:#e9edef;--muted:#8696a0;--green:#00a884;--mine:#005c4b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit;color:inherit}.app{height:100dvh;display:flex;flex-direction:column}.top,.detail-head{height:64px;display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--bar);z-index:5}.logo,.avatar{display:grid;place-items:center;border-radius:50%;font-weight:800}.logo{width:42px;height:42px;background:#d9a06f;color:#241812}.avatar{width:50px;height:50px;background:#273940}.avatar.live{background:#075e54}.avatar.external{background:#5c4620}.grow{min-width:0;flex:1}.title{font-weight:750;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub,.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{border:0;background:transparent;width:42px;height:42px;border-radius:50%;font-size:21px}.donebtn{border:0;border-radius:999px;padding:8px 12px;background:#075e54;color:#d8fff5;font-weight:750}.donebtn[hidden]{display:none}.search{padding:8px 12px;border-bottom:1px solid var(--line)}.search input{width:100%;border:0;outline:0;background:var(--bar);border-radius:10px;padding:11px 14px;font-size:16px}.view{position:relative;min-height:0;flex:1}.home,.detail{position:absolute;inset:0;overflow:auto}.detail{display:none}.chatlist{padding-bottom:85px}.chatrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line)}.chatrow:active{background:#ffffff0b}.ctitle{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:13px;margin-top:3px}.side{display:flex;flex-direction:column;gap:5px;text-align:right;color:var(--muted);font-size:11px}.badge{padding:3px 7px :48px;height:48px;flex:0 0 48px;border:0;border-radius:50%;background:var(--green);color:#062d26;font-size:21px;font-weight:800;touch-action:none;user-select:none}.sendmic.recording{background:#d9515d;color:#fff;transform:scale(.95)}.attachchip{position:fixed;left:14px;bottom:72px;z-index:8;background:#1f3138;border:1px solid #34505a;border-radius:10px;padding:8px 10px;max-width:calc(100vw - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.shade{position:fixed;inset:0;background:#0009;z-index:20;display:none}.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--bar);border-radius:18px;padding:12px}.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sheet button{border:0;background:#2a3940;border-radius:14px;padding:16px 6px;font-size:13px}.sheet button span{display:block;font-size:26px;margin-bottom:7px}.modalback{position:fixed;inset:0;background:#000a;z-index:30;display:none;place-items:center;padding:15px}.modal{width:min(520px,100%);background:var(--bar);border-radius:18px;padding:16px}.modal input,.modal textarea{width:100%;border:1px solid #3a4a51;background:#111b21;border-radius:11px;padding:11px;margin:5px 0;font-size:16px}.modal textarea{min-height:110px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#2b3a41}.primary{background:var(--green);color:#062d26;font-weight:750}.menu{position:fixed;right:8px;top:58px;z-index:15;display:none;min-width:200px;overflow:hidden;background:var(--bar);border-radius:12px;box-shadow:0 8px 30px #000a}.menu button{width:100%;border:0;background:transparent;text-align:left;padding:13px 15px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:50;display:none;max-width:90%;background:#26343a;border-radius:9px;padding:9px 12px;font-size:13px}input[type=file]{display:none}@media(min-width:760px){.app{max-width:760px;margin:auto;border-inline:1px solid var(--line)}.fab{right:calc(50% - 360px)}.composerbar{left:50%;right:auto;width:760px;transform:translateX(-50%)}.attachchip{left:calc(50% - 365px)}}
</style></head>
<body data-app-gateway="1"><div hidden aria-hidden="true"><strong>GPT Browser</strong><span>ChatGPT gestito da Tiremm</span><h1>GPT Browser</h1><span>Lavora con GPT</span></div><div class="app"><header class="top" id="homeTop"><div class="logo">G</div><div class="grow"><div class="title">GPT Browser</div><div class="sub" id="homeStatus">Lavori ChatGPT</div></div><button class="icon" id="searchToggle">⌕</button><button class="icon" id="menuBtn">⋮</button></header><div class="search" id="searchBar" hidden><input id="searchInput" placeholder="Cerca chat"></div><div class="view"><section class="home" id="home"><div class="chatlist" id="chatList"></div></section><section class="detail" id="detail"><header class="detail-head"><button class="icon" id="backBtn">‹</button><div class="avatar live">G</div><div class="grow"><div class="title" id="detailTitle">Chat</div><div class="sub" id="detailStatus"></div></div><button class="donebtn" id="doneBtn" type="button" hidden>Fatto</button><button class="icon" id="detailMenu">⋮</button></header><div class="messages" id="messages"></div><div class="attachchip" id="attachChip" hidden></div><div class="composerbar"><div class="composerbox"><button class="icon" id="attachBtn" type="button">📎</button><textarea id="composer" rows="1" placeholder="Messaggio"></textarea></div><button class="sendmic" id="sendMic" type="button">🎙</button></div></section></div><button class="fab" id="newBtn">＋</button></div>
<div class="menu" id="menu"><button id="refreshBtn">Aggiorna</button><label for="mobileProvider">LLM attivo</label><select id="mobileProvider"><option value="chatgpt">ChatGPT</option><option value="kimi">Kimi</option><option value="deepseek">DeepSeek</option></select><button id="openProviderBtn">Apri LLM selezionato</button><button id="importBtn">Importa chat aperte</button><button id="archiveBtn">Archivio ChatGPT</button><button id="apkBtn">Scarica APK</button><button id="logoutBtn">Esci</button></div><div class="shade" id="attachSheet"><div class="sheet"><h3>Allega</h3><div class="sheetgrid"><button id="cameraBtn"><span>📷</span>Fotocamera</button><button id="photoBtn"><span>🖼️</span>Foto</button><button id="fileBtn"><span>📄</span>File</button></div></div></div><input id="cameraInput" type="file" accept="image/*" capture="environment"><input id="photoInput" type="file" accept="image/*"><input id="fileInput" type="file" accept="image/*,application/pdf,text/plain,text/csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx"><div class="modalback" id="newModal"><form class="modal" id="newForm"><h2>Nuovo lavoro</h2><input id="newTitle" maxlength="300" placeholder="Titolo" required><textarea id="newPrompt" maxlength="32000" placeholder="Cosa deve fare GPT" required></textarea><div class="actions"><button type="button" class="btn" id="newCancel">Annulla</button><button class="btn primary">Avvia</button></div></form></div><div class="toast" id="toast"></div>
<script>
function rootPrefix(){const p=location.pathname,m='/assistant/v1',i=p.indexOf(m);return i>=0?p.slice(0,i):''}const ROOT=rootPrefix(),GPT=`${ROOT}/assistant/v1/gpt`,DIRECT_API=`${ROOT}/assistant/v1/chat`,TASKS=`${ROOT}/assistant/v1/tasks`,STATUS=`${ROOT}/assistant/v1/status`, $=s=>document.querySelector(s);const state={snap:null,current:null,search:'',recording:null,press:null,pending:new Map()};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v||'').replace(/\s+/g,' ').trim();function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2400)}async function gpt(path='',opt={}){const r=await fetch(GPT+(path?'/'+path:''),opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.detail||j.error||`HTTP ${r.status}`);return j}function status(j){if(j.last_error==='goal_blocked')return['Bloccato','err'];if(j.last_error==='goal_status_missing')return['Esito da verificare','warn'];if(/stalled|unavailable_after_retries/.test(String(j.last_error||'')))return['Fermata','err'];if(j.live_busy)return['Sta lavorando','live'];if(j.live_pending)return['In attesa di progresso','warn'];if(['queued','starting'].includes(j.state))return['In coda','warn'];if(j.state==='active')return['In attesa','warn'];if(j.state==='review'&&!j.last_error)return['Finito','live'];if(j.last_error)return['Attenzione','err'];return[j.state||'chat','']}function preview(j){const live=clean(j.live_activity_text||j.live_status_text);if((j.live_busy||j.live_pending)&&live)return live.slice(0,96);return clean(j.live_assistant_text||j.last_assistant_text||j.prompt||'Tocca per aprire').slice(0,96)}function elapsed(ms){const n=Math.max(0,Number(ms)||0);if(n<1000)return'adesso';const s=Math.floor(n/1000);if(s<60)return s+'s';const m=Math.floor(s/60);return m<60?m+'m':Math.floor(m/60)+'h'}function errorText(e){const x=String(e||'');if(x==='goal_status_missing')return'GPT ha chiuso il turno senza dire se deve continuare, fermarsi o dichiarare il GOAL: il ciclo automatico è stato fermato per evitare un loop.';if(x==='goal_blocked')return'Serve un tuo dato, permesso o intervento.';if(/stalled/.test(x))return'La chat non stava avanzando e i tentativi automatici di recupero sono terminati.';if(/unavailable_after_retries/.test(x))return'La conversazione non era leggibile dopo più tentativi.';return x}function feedback(j){const act=clean(j.live_activity_text||j.live_status_text),bits=[];if(j.live_response_latency_ms)bits.push('turno '+elapsed(j.live_response_latency_ms));if(j.live_progress_idle_ms)bits.push('ultimo progresso '+elapsed(j.live_progress_idle_ms)+' fa');if(Number(j.live_tool_activity_count||0)>0)bits.push('strumenti '+Number(j.live_tool_activity_count));if(Number(j.live_user_turns||0)>0||Number(j.live_assistant_turns||0)>0)bits.push('scambi '+Number(j.live_assistant_turns||0)+'/'+Number(j.live_user_turns||0));if(!act&&!bits.length)return'';return`<div class="activitycard"><div class="activitytitle">Attività visibile</div>${act?`<div>${esc(act)}</div>`:''}${bits.length?`<div class="metrics">${esc(bits.join(' · '))}</div>`:''}</div>`}
function renderHome(){const q=state.search.toLowerCase(),jobs=[...(state.snap?.jobs||[])].sort((a,b)=>a.rank-b.rank).filter(j=>!q||(`${j.title} ${preview(j)}`).toLowerCase().includes(q)),ext=(state.snap?.browser?.open_chats||[]).filter(r=>!r.managed).filter(r=>!q||String(r.title||'').toLowerCase().includes(q));let h='';for(const j of jobs){const[s,c]=status(j);h+=`<div class="chatrow" data-job="${j.job_id}"><div class="avatar ${j.live_busy?'live':''}">${j.live_busy?'●':'G'}</div><div><div class="ctitle">${esc(j.title)}</div><div class="preview">${esc(preview(j))}</div></div><div class="side"><span>#${j.rank}</span><span class="badge ${c}">${esc(s)}</span></div></div>`}for(const r of ext)h+=`<div class="chatrow" data-import="${esc(r.target_id)}"><div class="avatar external">＋</div><div><div class="ctitle">${esc(r.title||'Chat ChatGPT')}</div><div class="preview">Chat aperta · tocca per importarla</div></div><div class="side"><span class="badge warn">Importa</span></div></div>`;$('#chatList').innerHTML=h||'<div class="empty"><b>Nessuna chat</b>Premi ＋ per creare un lavoro.</div>';$('#homeStatus').textContent=`${jobs.length} lavori${ext.length?' · '+ext.length+' da importare':''}`}
function job(){return(state.snap?.jobs||[]).find(j=>j.job_id===state.current)}function localMsgs(id){try{return JSON.parse(localStorage.getItem('bottazzi.gpt.'+id)||'[]')}catch{return[]}}function saveMsgs(id,m){localStorage.setItem('bottazzi.gpt.'+id,JSON.stringify(m.slice(-50)))}function renderDetail(){const j=job();if(!j)return showHome();const[s]=status(j),doneReady=j.state==='review'&&!j.last_error&&!j.live_busy&&Boolean(String(j.last_assistant_text||'').trim());$('#detailTitle').textContent=j.title;$('#detailStatus').textContent=s+(j.project_name?' · '+j.project_name:'');$('#doneBtn').hidden=!doneReady;const local=localMsgs(j.job_id),answer=String(j.live_assistant_text||j.last_assistant_text||'').trim();let h='';for(const m of local)h+=`<div class="msg ${m.role}"><div class="bubble">${esc(m.text)}</div></div>`;if(answer&&!local.some(m=>m.role==='assistant'&&m.text===answer))h+=`<div class="msg assistant"><div class="bubble">${esc(answer)}<div class="bubbletools"><button class="tiny" data-speak="${encodeURIComponent(answer)}">🔊</button></div></div></div>`;h+=feedback(j);if(j.live_busy)h+='<div class="working"><i class="dot"></i>GPT sta lavorando davvero…</div>';else if(j.live_pending)h+='<div class="working"><i class="dot"></i>In attesa di progresso · recupero automatico attivo</div>';if(j.last_error)h+=`<div class="msg assistant"><div class="bubble">⚠ ${esc(errorText(j.last_error))}</div></div>`;$('#messages').innerHTML=h||'<div class="empty"><b>Chat pronta</b>Scrivi o tieni premuto 🎙.</div>';const a=state.pending.get(j.job_id);$('#attachChip').hidden=!a;$('#attachChip').textContent=a?'📎 '+a:'';requestAnimationFrame(()=>$('#messages').scrollTop=$('#messages').scrollHeight)}function showHome(){$('#detail').style.display='none';$('#home').style.display='block';$('#homeTop').style.display='flex';$('#newBtn').style.display='block';state.current=null;renderHome()}function openJob(id){state.current=id;$('#home').style.display='none';$('#homeTop').style.display='none';$('#detail').style.display='block';$('#newBtn').style.display='none';renderDetail()}async function refresh(){if(state.recording)return;try{state.snap=await gpt();state.current?renderDetail():renderHome()}catch(e){toast('GPT Browser non raggiungibile: '+e.message)}}
async function send(){const j=job();if(!j)return;const b=$('#composer'),att=state.pending.get(j.job_id),typed=b.value.trim(),text=typed||(att?'Analizza questo allegato.':'');if(!text)return;b.value='';b.style.height='auto';const m=localMsgs(j.job_id);m.push({role:'user',text:(att?'📎 '+att+(typed?' · ':''):'')+text});saveMsgs(j.job_id,m);state.pending.delete(j.job_id);renderDetail();try{await gpt(`jobs/${j.job_id}/message`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});toast('Inviato · continua fino al GOAL');await refresh()}catch(e){toast('Invio non riuscito: '+e.message)}}async function upload(file,image=false){const j=job();if(!j||!file)return;toast('Allego '+file.name+'…');try{await gpt(`jobs/${j.job_id}/attachment`,{method:'POST',headers:{'content-type':file.type||'application/octet-stream','x-bottazzi-file-name':encodeURIComponent(file.name),'x-bottazzi-image':image?'1':'0'},body:file});state.pending.set(j.job_id,file.name);renderDetail();toast('Allegato pronto')}catch(e){toast('Allegato non riuscito: '+e.message)}}async function startMic(e){const j=job();if(!j||state.recording||state.press)return;e.preventDefault();const p={pointer:e.pointerId,released:false};state.press=p;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm',r=new MediaRecorder(stream,{mimeType:mime}),chunks=[];r.ondataavailable=x=>{if(x.data?.size)chunks.push(x.data)};r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());state.recording=null;$('#sendMic').classList.remove('recording');$('#sendMic').textContent='🎙';try{toast('Trascrivo…');const z=await gpt('audio/transcribe',{method:'POST',headers:{'content-type':r.mimeType||'audio/webm'},body:new Blob(chunks,{type:r.mimeType||'audio/webm'})});$('#composer').value=String(z.text||'').trim();await send()}catch(x){toast('Vocale non inviato: '+x.message)}};state.press=null;state.recording={r,pointer:e.pointerId};$('#sendMic').classList.add('recording');$('#sendMic').textContent='●';try{$('#sendMic').setPointerCapture(e.pointerId)}catch{}r.start();if(p.released)r.stop()}catch(x){state.press=null;toast('Permesso microfono negato')}}function stopMic(e){if(state.press){state.press.released=true;return}const r=state.recording;if(!r)return;if(e.pointerId!==undefined&&r.pointer!==e.pointerId)return;e.preventDefault();if(r.r.state!=='inactive')r.r.stop()}function speak(t){if(window.BotTazziNative?.speak)return window.BotTazziNative.speak(t);if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';speechSynthesis.speak(u)}}
const selectedProvider=()=>localStorage.getItem('bottazzi-gpt-provider')||'chatgpt';const setSelectedProvider=v=>{localStorage.setItem('bottazzi-gpt-provider',v);$('#mobileProvider').value=v};$('#mobileProvider').value=selectedProvider();$('#mobileProvider').onchange=e=>setSelectedProvider(e.target.value);$('#openProviderBtn').onclick=async()=>{try{const p=selectedProvider();await gpt('providers/open',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:p})});toast(p+' aperto nel browser dedicato')}catch(e){toast('Apertura provider non riuscita: '+e.message)}};$('#chatList').onclick=async e=>{const r=e.target.closest('[data-job],[data-import]');if(!r)return;if(r.dataset.job)return openJob(r.dataset.job);try{toast('Importo la chat…');const z=await gpt('jobs/import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({target_id:r.dataset.import})});await refresh();openJob(z.job.job_id)}catch(x){toast('Import non riuscito: '+x.message)}};$('#backBtn').onclick=showHome;$('#newBtn').onclick=()=>{$('#newModal').style.display='grid';$('#newTitle').focus()};$('#newCancel').onclick=()=>$('#newModal').style.display='none';$('#newForm').onsubmit=async e=>{e.preventDefault();const title=$('#newTitle').value.trim(),prompt=$('#newPrompt').value.trim();if(!title||!prompt)return;$('#newModal').style.display='none';try{const z=await gpt('jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,prompt,project_name:'',project_url:null,auto_start:true})});$('#newTitle').value='';$('#newPrompt').value='';await refresh();if(z.job?.job_id)openJob(z.job.job_id)}catch(x){toast('Creazione non riuscita: '+x.message)}};$('#searchToggle').onclick=()=>{$('#searchBar').hidden=!$('#searchBar').hidden;if(!$('#searchBar').hidden)$('#searchInput').focus()};$('#searchInput').oninput=e=>{state.search=e.target.value;renderHome()};$('#menuBtn').onclick=()=>$('#menu').style.display=$('#menu').style.display==='block'?'none':'block';$('#refreshBtn').onclick=()=>{$('#menu').style.display='none';refresh()};document.querySelectorAll('[data-provider-open]').forEach(b=>b.onclick=async()=>{$('#menu').style.display='none';try{const z=await gpt('providers/open',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:b.dataset.providerOpen})});toast((z.label||b.dataset.providerOpen)+' aperto nel browser dedicato')}catch(e){toast('Apertura provider non riuscita: '+e.message)}});$('#importBtn').onclick=()=>{$('#menu').style.display='none';toast('Le chat da importare sono già nella lista')};$('#archiveBtn').onclick=()=>{$('#menu').style.display='none';toast('Archivio: usa Cerca')};$('#logoutBtn').onclick=async()=>{await fetch(`${ROOT}/logout`,{method:'POST'});location.reload()};async function markDone(){const j=job();if(!j)return;try{await gpt(`jobs/${j.job_id}/state`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:'done'})});toast('Segnato come fatto');showHome();await refresh()}catch(e){toast('Non riesco a chiudere il lavoro: '+e.message)}}$('#doneBtn').onclick=markDone;$('#detailMenu').onclick=()=>{const j=job();toast(j?.live_busy?'GPT sta producendo risposta':j?.live_pending?'GPT è avviato ma non sta avanzando: recupero automatico attivo':'Il lavoro resta aperto finché premi Fatto')};$('#attachBtn').onclick=()=>$('#attachSheet').style.display='block';$('#attachSheet').onclick=e=>{if(e.target===$('#attachSheet'))$('#attachSheet').style.display='none'};$('#cameraBtn').onclick=()=>{$('#attachSheet').style.display='none';$('#cameraInput').click()};$('#photoBtn').onclick=()=>{$('#attachSheet').style.display='none';$('#photoInput').click()};$('#fileBtn').onclick=()=>{$('#attachSheet').style.display='none';$('#fileInput').click()};for(const [id,img] of [['#cameraInput',true],['#photoInput',true],['#fileInput',false]])$(id).onchange=e=>{const f=e.target.files?.[0];e.target.value='';if(f)upload(f,img)};$('#composer').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';$('#sendMic').textContent=(e.target.value.trim()||state.pending.get(state.current))?'➤':'🎙'};$('#sendMic').onclick=()=>{if($('#composer').value.trim()||state.pending.get(state.current))send()};$('#sendMic').addEventListener('pointerdown',e=>{if(!$('#composer').value.trim()&&!state.pending.get(state.current))startMic(e)});document.addEventListener('pointerup',stopMic);document.addEventListener('pointercancel',stopMic);document.addEventListener('contextmenu',e=>{if(e.target===$('#sendMic'))e.preventDefault()});$('#messages').onclick=e=>{const b=e.target.closest('[data-speak]');if(b)speak(decodeURIComponent(b.dataset.speak))};document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});document.getElementById("apkBtn").onclick=()=>{location.href=ROOT+"/gpt-browser.apk"};refresh();setInterval(refresh,3000);
</script></body></html>
