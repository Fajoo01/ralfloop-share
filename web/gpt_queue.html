<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot-tazzi GPT Browser</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f4f4f5;background:#111214;line-height:1.35}
*{box-sizing:border-box}body{margin:0;background:#111214;color:#f4f4f5}button,input,textarea,select{font:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:18px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}.top h1{font-size:20px;margin:0}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#24262a;font-size:12px}.ok{background:#183b28}.warn{background:#5d4218}.err{background:#5b2323}
.toolbar,.newjob{background:#181a1e;border:1px solid #2d3036;border-radius:14px;padding:12px;margin-bottom:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{width:64px}.newjob{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:10px}.newjob textarea{grid-column:1/-1;min-height:86px}.newjob .actions{grid-column:1/-1;display:flex;justify-content:flex-end}.field{background:#0f1012;border:1px solid #343840;color:#f4f4f5;border-radius:9px;padding:9px 10px;min-height:44px;max-width:100%}
.btn{border:1px solid #3b4049;background:#25282e;color:#fff;border-radius:9px;padding:10px 12px;min-height:44px;cursor:pointer;touch-action:manipulation}.btn:hover{background:#30343b}.primary{background:#155e3a;border-color:#1d7d4d}.done-ready{background:#155e3a;border-color:#2aa365;font-weight:700;box-shadow:0 0 0 1px rgba(42,163,101,.25),0 0 14px rgba(42,163,101,.18)}.danger{background:#5b2323}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:14px}.panel{background:#181a1e;border:1px solid #2d3036;border-radius:14px;overflow:hidden}.panel h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid #2d3036}
.list{padding:10px}.project{margin:0 0 14px}.project-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#a1a1aa;margin:6px 4px}.job{border:1px solid #30343b;border-radius:12px;padding:11px;margin-bottom:9px;background:#141619}.job-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.job-title{font-weight:700}.small{font-size:12px;color:#a1a1aa}.state{font-size:11px;padding:3px 7px;border-radius:999px;background:#2b2f36}.state.active{background:#154c32}.state.queued{background:#3e3a1d}.state.blocked,.state.failed{background:#5a2525}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.working{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#b7f7d2}.working-dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.55);animation:workingPulse 1.2s ease-out infinite}@keyframes workingPulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55);opacity:1}70%{box-shadow:0 0 0 9px rgba(74,222,128,0);opacity:.7}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);opacity:1}}@media(prefers-reduced-motion:reduce){.working-dot{animation:none}}.answer{margin-top:10px;padding:10px;border-radius:10px;background:#101d17;border:1px solid #24543d}.answer-text{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.composer{display:flex;gap:7px;margin-top:10px}.composer textarea{flex:1;min-height:58px;resize:vertical}.browser-card{border:1px solid #30343b;border-radius:12px;padding:10px;margin-bottom:8px}.browser-card.managed{border-color:#225f43}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#c4c7ce;overflow-wrap:anywhere;word-break:break-word}.empty{padding:18px;color:#9296a0;text-align:center}.errorbar{display:none;background:#5b2323;border:1px solid #8a3434;border-radius:10px;padding:9px 11px;margin-bottom:12px}.errorbar.show{display:block}.activitybar{display:none;background:#183b28;border:1px solid #2a6a47;border-radius:10px;padding:9px 11px;margin-bottom:12px}.activitybar.show{display:block}.mic{touch-action:none;user-select:none;-webkit-user-select:none}.mic.recording{background:#7a1f2a;border-color:#b43345;transform:scale(.96)}.send-feedback{margin-top:6px;color:#b7f7d2;font-size:12px}.live-feedback{margin-top:8px;padding:8px 10px;border:1px solid #2d4d41;border-radius:9px;background:#132019;color:#d4eee1;font-size:12px}.live-feedback .small{margin-top:4px}
.history-panel{margin-top:14px}.historybar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #2d3036}.historybar input{flex:1}.history-card{border-bottom:1px solid #292c31;padding:10px 4px}.history-card:last-child{border-bottom:0}
.urlbar{display:flex;gap:8px;align-items:center}.urlbar #chat-url{flex:1}.urlbar .queue-rank{width:150px;flex:0 0 150px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.newjob{grid-template-columns:1fr}.newjob textarea,.newjob .actions{grid-column:1}.top{align-items:flex-start;flex-direction:column}.historybar{flex-direction:column}}
@media(max-width:700px){.wrap{padding:10px}.field{font-size:16px}.top{gap:10px;margin-bottom:10px}.meta{gap:5px}.toolbar{display:grid;grid-template-columns:1fr 1fr;padding:10px}.toolbar label{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar input{width:88px}.urlbar{grid-template-columns:1fr}.urlbar .queue-rank{width:100%;flex:auto}.toolbar .btn{width:100%}.newjob{padding:10px}.newjob .actions,.newjob .actions .btn{width:100%}.panel{border-radius:12px}.panel h2{padding:12px}.list{padding:8px}.job,.browser-card{padding:10px}.job-head{gap:8px;flex-direction:column}.state{align-self:flex-start}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.row .btn{width:100%}.composer{flex-direction:column}.composer .btn{width:100%}.historybar{padding:8px}.historybar .btn,.historybar .field{width:100%}.history-card .job-head{flex-direction:column}.history-card .row{grid-template-columns:1fr}.project-title{margin-top:10px}.small{font-size:13px}.mono{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Bot-tazzi · GPT Browser</h1><div id="meta" class="meta"></div></div>
  <div id="error" class="errorbar"></div>
  <div id="activity" class="activitybar" role="status" aria-live="polite"></div>
  <input id="voice-file" type="file" accept="audio/*" capture hidden>
  <div class="toolbar providerbar" aria-label="Provider nello stesso browser dedicato">
    <span class="small">Stesso browser dedicato:</span>
    <button class="btn primary" data-provider="chatgpt">ChatGPT</button>
    <button class="btn" data-provider="deepseek">DeepSeek</button>
    <button class="btn" data-provider="kimi">Kimi</button>
    <span class="small">DeepSeek e Kimi si aprono nello stesso profilo; la coda automatica resta ChatGPT.</span>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="start-next">Avvia prossimo</button>
    <label class="small">Slot gestiti <input class="field" id="slots" type="number" min="1" max="12"></label>
    <button class="btn" id="save-slots">Salva slot</button>
    <button class="btn" id="refresh">Aggiorna tutto</button>
  </div>
  <div class="toolbar urlbar">
    <input class="field" id="chat-url" placeholder="Incolla URL chat ChatGPT: /c/... oppure /g/.../c/..." aria-label="URL chat ChatGPT">
    <input class="field queue-rank" id="queue-rank" type="number" min="1" step="1" placeholder="Posizione coda" aria-label="Posizione nella coda">
    <button class="btn primary" id="resume-url">Aggiungi / riprendi da URL</button>
  </div>
  <form id="newjob" class="newjob">
    <input class="field" name="title" placeholder="Titolo lavoro" required>
    <select class="field" id="project-select" name="project_choice"><option value="">Senza progetto</option></select>
    <input class="field" name="project_url_manual" placeholder="URL progetto manuale (opzionale)">
    <textarea class="field" name="prompt" placeholder="Prompt da inviare quando il lavoro parte"></textarea>
    <div class="actions"><button class="btn primary" type="submit">Crea e avvia nuova chat</button></div>
  </form>
  <div class="grid">
    <section class="panel"><h2>Coda lavori</h2><div id="jobs" class="list"></div></section>
    <section class="panel"><h2>Chat aperte nel browser</h2><div id="browser" class="list"></div></section>
  </div>
  <section class="panel history-panel"><h2>Progetti ChatGPT</h2><div id="account-projects" class="list"></div></section>
  <section class="panel history-panel">
    <h2>Archivio GPT <span id="history-count" class="small"></span></h2>
    <div class="historybar">
      <input class="field" id="history-search" placeholder="Cerca per titolo nello storico GPT" aria-label="Cerca per titolo">
      <select class="field" id="history-project-filter"><option value="">Tutti i progetti</option><option value="__none__">Senza progetto</option></select>
      <button class="btn" id="refresh-history">Aggiorna archivio</button>
    </div>
    <div id="history-status" class="small list" role="status"></div>
    <div id="history" class="list"></div>
    <button id="history-more" class="btn" hidden>Carica altre chat</button>
  </section>
</div>
<script>
const state={snapshot:null,drafts:new Map(),busy:false,history:[],projects:[],nextCursor:"",historyRequest:0,historyBusy:false,sentFeedback:new Map(),recording:null,voicePress:null,pendingVoiceJob:null,activityTimer:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=v=>String(v||'').split('/').filter(Boolean).pop()?.slice(0,10)||'—';
const age=ms=>{const n=Math.max(0,Number(ms)||0),s=Math.floor(n/1000);if(s<1)return'adesso';if(s<60)return`${s}s`;const m=Math.floor(s/60);return m<60?`${m}m`:`${Math.floor(m/60)}h`};
function withQueueRank(payload){const raw=String($('#queue-rank')?.value||'').trim();if(!raw)return payload;const rank=Number(raw);return Number.isInteger(rank)&&rank>=1&&rank<=10000?{...payload,rank}:payload}
function rememberDrafts(){document.querySelectorAll('[data-draft-job]').forEach(el=>state.drafts.set(el.dataset.draftJob,el.value));}
function error(msg=''){const box=$('#error');box.textContent=msg;box.classList.toggle('show',Boolean(msg));}
function activity(msg=''){const box=$('#activity');clearTimeout(state.activityTimer);box.textContent=msg;box.classList.toggle('show',Boolean(msg));if(msg)state.activityTimer=setTimeout(()=>{box.textContent='';box.classList.remove('show')},2200);}
async function api(path,opt={}){const res=await fetch(path,{headers:{'Content-Type':'application/json','X-Bottazzi-Frontend':'1'},...opt});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(typeof data.detail==='string'?data.detail:(data.error||`${res.status} ${res.statusText}`));return data;}
async function act(path,body){if(state.busy)return;state.busy=true;error('');activity('Invio…');try{const result=await api(path,{method:'POST',body:body===undefined?undefined:JSON.stringify(body)});activity('Ricevuto.');await refresh();const launch=result.start||result.pump;if(launch?.errors?.length){const first=launch.errors[0];if(launch.opened?.length){error(first.error);return result}throw new Error(first.error)}return result}catch(e){error(e.message);activity('');throw e}finally{state.busy=false}}
function jobActions(j){const parts=[];if(['queued','blocked','failed','review','starting'].includes(j.state))parts.push(`<button class="btn" data-action="start" data-id="${esc(j.job_id)}">Avvia</button>`);if(j.target_id)parts.push(`<button class="btn" data-action="activate" data-id="${esc(j.job_id)}">Apri</button>`);if(j.state==='active'&&j.target_id&&j.live_busy)parts.push(`<button class="btn danger" data-action="interrupt" data-id="${esc(j.job_id)}">Interrompi</button>`);if(j.target_id)parts.push(`<button class="btn" data-action="release" data-id="${esc(j.job_id)}">Libera scheda</button>`);const completedText=String(j.live_assistant_text||j.last_assistant_text||'').trim();const doneReady=j.state==='review'&&!j.last_error&&!j.live_busy&&Boolean(completedText);parts.push(`<button class="btn" data-action="up" data-id="${esc(j.job_id)}" data-rank="${j.rank}">↑</button><button class="btn" data-action="down" data-id="${esc(j.job_id)}" data-rank="${j.rank}">↓</button><button class="btn${doneReady?' done-ready':''}" data-action="done" data-id="${esc(j.job_id)}"${doneReady?' title="Risposta conclusa: premi tu per chiudere il lavoro"':''}>Fatto</button>`);return parts.join('')}
function renderJobs(s){const root=$('#jobs');const jobs=[...(s.jobs||[])].sort((a,b)=>Number(a.rank)-Number(b.rank));if(!jobs.length){root.innerHTML='<div class="empty">Nessun lavoro in coda</div>';return}root.innerHTML=jobs.map(j=>{const draft=state.drafts.get(j.job_id)||'';const answer=String(j.live_assistant_text||j.last_assistant_text||'').trim();const canSend=Boolean(j.conversation_url)&&(j.state==='active'||(['review','blocked','failed'].includes(j.state)&&j.last_error!=='temporary_access_limited'));const sendLabel=j.state==='active'?'Invia qui':'Invia e riprendi';const working=Boolean(j.live_busy);const feedback=state.sentFeedback.get(j.job_id)||'';const recording=state.recording?.jobId===j.job_id;const liveNote=String(j.live_activity_text||j.live_status_text||'').trim(),liveBits=[];if(j.live_response_latency_ms)liveBits.push(`turno ${age(j.live_response_latency_ms)}`);if(j.live_progress_idle_ms)liveBits.push(`ultimo progresso ${age(j.live_progress_idle_ms)} fa`);if(Number(j.live_tool_activity_count||0)>0)liveBits.push(`strumenti ${Number(j.live_tool_activity_count)}`);const liveFeedback=(liveNote||liveBits.length)?`<div class="live-feedback"><strong>Attività visibile</strong>${liveNote?`<div>${esc(liveNote)}</div>`:''}${liveBits.length?`<div class="small">${esc(liveBits.join(' · '))}</div>`:''}</div>`:'';return `<article class="job"><div class="job-head"><div><div class="job-title">${esc(j.title)}</div><div class="small">#${j.rank} · ${esc(j.project_name||'Senza progetto')}</div></div><span class="state ${esc(j.state)}">${esc(j.state)}</span></div>${j.conversation_url?`<div class="mono">chat ${esc(short(j.conversation_url))}${j.target_id?` · target ${esc(short(j.target_id))}`:''}</div>`:''}${j.last_error?`<div class="small">Errore: ${esc(j.last_error)}</div>`:''}${working?`<div class="working" aria-live="polite"><span class="working-dot" aria-hidden="true"></span><span>GPT sta lavorando…${j.live_cached?' · ultimo campione valido':''}</span></div>`:''}${liveFeedback}${answer?`<div class="answer"><div class="small">${working?'Testo GPT · live':'Risposta GPT'}${j.live_cached?' · aggiornamento in ritardo':''}</div><div class="answer-text">${esc(answer)}</div></div>`:''}<div class="row">${jobActions(j)}</div>${canSend?`<div class="composer"><textarea class="field" data-draft-job="${esc(j.job_id)}" placeholder="Scrivi il messaggio successivo">${esc(draft)}</textarea><button class="btn mic${recording?' recording':''}" data-action="voice" data-id="${esc(j.job_id)}" title="${recording?'Rilascia per inviare':'Tieni premuto per parlare'}">${recording?'●':'🎙'}</button><button class="btn primary" data-action="send" data-id="${esc(j.job_id)}">${sendLabel}</button></div>${feedback?`<div class="send-feedback">${esc(feedback)}</div>`:''}`:''}</article>`}).join('')}
function renderBrowser(s){const root=$('#browser');const rows=s.browser?.open_chats||[];if(!rows.length){root.innerHTML='<div class="empty">Nessuna chat aperta rilevata</div>';return}root.innerHTML=rows.map(r=>`<div class="browser-card ${r.managed?'managed':''}"><div class="job-head"><div><div class="job-title">${esc(r.title||'Chat GPT')}</div><div class="mono">${esc(short(r.conversation_url))}</div></div><span class="state ${r.managed?'active':''}">${r.managed?'gestita':'esterna'}</span></div><div class="small">${r.focused?'in primo piano · ':''}${r.busy?'GPT occupato · ':''}${esc(r.project_name||'')}</div>${r.managed?`<div class="small">job ${esc(short(r.job_id))}</div>`:`<div class="row"><button class="btn" data-import="${esc(r.target_id)}">Importa nella coda</button></div>`}</div>`).join('')}
function renderProjectMenus(){const create=$('#project-select'),filter=$('#history-project-filter');const createValue=create?.value||'',filterValue=filter?.value||'';if(create){create.innerHTML='<option value="">Senza progetto</option>'+state.projects.map((p,i)=>`<option value="${esc(p.url||`__name__${i}`)}" data-name="${esc(p.title||'Progetto ChatGPT')}" data-url="${esc(p.url||'')}">${esc(p.title||'Progetto ChatGPT')}</option>`).join('');if([...create.options].some(o=>o.value===createValue))create.value=createValue}if(filter){filter.innerHTML='<option value="">Tutti i progetti</option><option value="__none__">Senza progetto</option>'+state.projects.map((p,i)=>`<option value="${esc(p.project_id||p.url||`__name__${i}`)}">${esc(p.title||'Progetto ChatGPT')}</option>`).join('');if([...filter.options].some(o=>o.value===filterValue))filter.value=filterValue}}
function renderAccountProjects(){const root=$('#account-projects');root.innerHTML=state.projects.length?state.projects.map((p,i)=>`<div class="browser-card"><div class="job-title">${esc(p.title)}</div><div class="row"><button class="btn" data-project-open="${i}">Apri progetto</button><button class="btn" data-project-chats="${i}">Chat del progetto</button><button class="btn" data-project-new="${i}">Nuovo lavoro</button></div></div>`).join(''):'<div class="empty">Nessun progetto disponibile</div>'}
function renderHistory(){const root=$('#history'),rows=state.history;$('#history-count').textContent=`· ${rows.length} caricate`;if(!rows.length){root.innerHTML='<div class="empty">Nessuna chat caricata per questa ricerca</div>';return}root.innerHTML=rows.map((r,i)=>`<div class="history-card"><div class="job-head"><div><div class="job-title">${esc(r.title||'Chat GPT')}</div><div class="small">${esc(r.project_name||'')}</div></div><span class="state ${r.managed?'active':''}">${r.managed?esc(r.job_state||'gestita'):(r.open?'aperta':'storico')}</span></div><div class="row"><button class="btn primary" data-resume-index="${i}">${r.managed?'Riprendi lavoro':'Riprendi'}</button></div></div>`).join('')}
function render(s){rememberDrafts();state.snapshot=s;const b=s.browser||{};$('#slots').value=s.settings?.max_open_chats||3;$('#meta').innerHTML=`<span class="pill ${b.error?'err':'ok'}">browser ${b.error?'errore':'online'}</span><span class="pill">slot ${b.managed_open_count||0}/${b.max_open_chats||s.settings?.max_open_chats||0}</span><span class="pill">schede ChatGPT ${b.open_chat_count||0}</span>${b.unmanaged_open_count?`<span class="pill warn">esterne ${b.unmanaged_open_count}</span>`:''}`;renderJobs(s);renderBrowser(s)}
async function refresh(){try{render(await api('/api/snapshot'));error('')}catch(e){error(e.message)}}
async function refreshHistory(append=false){const request=++state.historyRequest;const status=$('#history-status');state.historyBusy=true;$('#history-more').disabled=true;status.textContent='Caricamento storico…';try{const params=new URLSearchParams({query:$('#history-search').value.trim(),project_id:$('#history-project-filter').value,cursor:append?state.nextCursor:''});const h=await api('/api/history?'+params);if(request!==state.historyRequest)return;const byUrl=new Map((append?state.history:[]).map(r=>[r.conversation_url,r]));for(const row of h.chats||[])byUrl.set(row.conversation_url,row);state.history=[...byUrl.values()];state.projects=h.projects||[];state.nextCursor=h.next_cursor||'';renderProjectMenus();renderAccountProjects();renderHistory();$('#history-more').hidden=!state.nextCursor;const messages=[];if(h.error)messages.push(h.error==='account_catalog_rate_limited'?'ChatGPT limita temporaneamente lo storico. Riprova più tardi.':`Storico incompleto: ${h.error}`);if(h.project_error)messages.push('Elenco progetti incompleto.');if(!h.error)messages.push(h.complete?'Fine dello storico per questa ricerca.':'Altre chat disponibili: continua il caricamento.');messages.push('Ricerca per titolo.');status.textContent=messages.join(' ')}catch(e){if(request===state.historyRequest)status.textContent=e.message}finally{if(request===state.historyRequest){state.historyBusy=false;$('#history-more').disabled=false}}}
async function sendJobText(id,text,restoreText=''){const clean=String(text||'').trim();if(!clean)return;state.sentFeedback.set(id,'Invio a Bot-tazzi…');activity('Messaggio inviato a Bot-tazzi…');if(state.snapshot)render(state.snapshot);try{await api(`/api/jobs/${id}/message`,{method:'POST',body:JSON.stringify({text:clean})});state.sentFeedback.set(id,'Inviato · GPT sta lavorando');activity('Inviato. GPT sta lavorando.');await refresh()}catch(e){if(restoreText)state.drafts.set(id,restoreText);state.sentFeedback.set(id,'Invio non riuscito');error(e.message);activity('');await refresh()}}
async function sendVoiceBlob(id,blob){if(!blob||!blob.size)return;state.sentFeedback.set(id,'Trascrizione vocale…');activity('Bot-tazzi sta trascrivendo il vocale…');if(state.snapshot)render(state.snapshot);try{const result=await api('/api/audio/transcribe',{method:'POST',headers:{'Content-Type':blob.type||'application/octet-stream','X-Bottazzi-Frontend':'1'},body:blob});const text=String(result.text||'').trim();if(!text)throw new Error('audio_not_understood');state.sentFeedback.set(id,`Trascritto: ${text.slice(0,180)}${text.length>180?'…':''} · invio…`);if(state.snapshot)render(state.snapshot);await sendJobText(id,text)}catch(e){state.sentFeedback.set(id,'Vocale non inviato');error(e.message);activity('');if(state.snapshot)render(state.snapshot)}}
async function startVoiceHold(id,pointerId,button){if(state.recording||state.voicePress){const active=state.recording?.jobId||state.voicePress?.jobId;if(active!==id)error('C’è già una registrazione in corso.');return}const press={jobId:id,pointerId,released:false};state.voicePress=press;if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){state.voicePress=null;state.pendingVoiceJob=id;state.sentFeedback.set(id,'Microfono continuo non disponibile: apro il registratore del dispositivo.');if(state.snapshot)render(state.snapshot);$('#voice-file').click();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';const recorder=new MediaRecorder(stream,{mimeType:mime});const chunks=[];recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});state.recording=null;if(state.snapshot)render(state.snapshot);sendVoiceBlob(id,blob)};state.recording={jobId:id,recorder,pointerId};if(button?.setPointerCapture&&pointerId!==undefined){try{button.setPointerCapture(pointerId)}catch{}}state.sentFeedback.set(id,'Registrazione… rilascia per inviare');recorder.start();const released=press.released;state.voicePress=null;if(state.snapshot)render(state.snapshot);if(released&&recorder.state!=='inactive')recorder.stop()}catch(e){if(state.voicePress===press)state.voicePress=null;error(e.message)}}
function finishVoiceHold(id,pointerId){const press=state.voicePress;if(press&&press.jobId===id&&(pointerId===undefined||press.pointerId===undefined||pointerId===press.pointerId)){press.released=true;return}const current=state.recording;if(!current||current.jobId!==id)return;if(pointerId!==undefined&&current.pointerId!==undefined&&pointerId!==current.pointerId)return;if(current.recorder.state!=='inactive')current.recorder.stop()}
$('#voice-file').addEventListener('change',()=>{const file=$('#voice-file').files?.[0],id=state.pendingVoiceJob;state.pendingVoiceJob=null;$('#voice-file').value='';if(file&&id)sendVoiceBlob(id,file)});
$('#newjob').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),choice=$('#project-select'),opt=choice?.selectedOptions?.[0],manual=String(f.get('project_url_manual')||'').trim(),selected=choice?.value||'',projectName=selected?(opt?.dataset?.name||opt?.textContent||'Progetto ChatGPT'):'',projectUrl=(opt?.dataset?.url||'')||manual||null,title=String(f.get('title')||''),prompt=String(f.get('prompt')||''),titleBox=e.currentTarget.querySelector('[name="title"]'),promptBox=e.currentTarget.querySelector('[name="prompt"]');titleBox.value='';promptBox.value='';activity('Nuova chat inviata a Bot-tazzi…');try{await act('/api/jobs',{title,prompt,project_name:projectName,project_url:projectUrl,auto_start:true})}catch(_e){titleBox.value=title;promptBox.value=prompt}});
$('#resume-url').onclick=()=>{const raw=$('#chat-url').value.trim();if(!raw)return;try{const u=new URL(raw,'https://chatgpt.com/');if(u.origin!=='https://chatgpt.com')throw new Error('URL ChatGPT non valido');const m=u.pathname.match(/^\/(?:g\/([^/]+)\/)?c\/([A-Za-z0-9-]+)/);if(!m)throw new Error('URL chat ChatGPT non valido');const canonical=`https://chatgpt.com/c/${m[2]}`,context=m[1]?`https://chatgpt.com/g/${m[1]}/c/${m[2]}`:canonical;return act('/api/history/resume',withQueueRank({conversation_url:canonical,conversation_context_url:context,title:'Chat GPT'})).then(()=>refreshHistory())}catch(e){error(e.message)}};
$('#start-next').onclick=()=>act('/api/start-next');
$('#save-slots').onclick=()=>act('/api/settings',{max_open_chats:Number($('#slots').value)});
$('#refresh').onclick=()=>{refresh();refreshHistory()};
$('#refresh-history').onclick=()=>refreshHistory();
$('#history-more').onclick=()=>{if(!state.historyBusy)refreshHistory(true)};
let searchTimer;$('#history-search').addEventListener('input',()=>{clearTimeout(searchTimer);state.historyRequest++;searchTimer=setTimeout(()=>refreshHistory(),400)});$('#history-project-filter').addEventListener('change',()=>refreshHistory());
document.addEventListener('input',e=>{if(e.target.matches('[data-draft-job]'))state.drafts.set(e.target.dataset.draftJob,e.target.value)});
document.addEventListener('pointerdown',e=>{const mic=e.target.closest('[data-action="voice"]');if(!mic)return;e.preventDefault();startVoiceHold(mic.dataset.id,e.pointerId,mic)});
document.addEventListener('pointerup',e=>{const id=state.recording?.jobId||state.voicePress?.jobId;if(!id)return;e.preventDefault();finishVoiceHold(id,e.pointerId)});
document.addEventListener('pointercancel',e=>{const id=state.recording?.jobId||state.voicePress?.jobId;if(id)finishVoiceHold(id,e.pointerId)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-action="voice"]'))e.preventDefault()});
document.addEventListener('click',e=>{const provider=e.target.closest('[data-provider]');if(provider)return act('/api/providers/open',{provider:provider.dataset.provider});const projectButton=e.target.closest('[data-project-open],[data-project-chats],[data-project-new]');if(projectButton){const mode=projectButton.hasAttribute('data-project-open')?'open':projectButton.hasAttribute('data-project-chats')?'chats':'new';const p=state.projects[Number(projectButton.getAttribute('data-project-'+mode))];if(!p)return;if(mode==='open')return act('/api/projects/open',{project_url:p.url});if(mode==='chats'){$('#history-project-filter').value=p.project_id;$('#history-search').value='';return refreshHistory()}$('#project-select').value=p.url;$('#newjob').scrollIntoView({behavior:'smooth'});return $('#newjob input[name="title"]').focus()}const resume=e.target.closest('[data-resume-index]');if(resume){const row=state.history[Number(resume.dataset.resumeIndex)];if(row)return act('/api/history/resume',withQueueRank({conversation_url:row.conversation_url,conversation_context_url:row.conversation_context_url||row.conversation_url,title:row.title||'Chat GPT',project_name:row.project_name||'',project_url:row.project_url||null})).then(()=>refreshHistory())}const imp=e.target.closest('[data-import]');if(imp)return act('/api/jobs/import',withQueueRank({target_id:imp.dataset.import}));const btn=e.target.closest('[data-action]');if(!btn)return;const id=btn.dataset.id,a=btn.dataset.action;if(a==='start')return act(`/api/jobs/${id}/start`);if(a==='activate')return act(`/api/jobs/${id}/activate`);if(a==='interrupt')return act(`/api/jobs/${id}/interrupt`);if(a==='release')return act(`/api/jobs/${id}/release`);if(a==='done')return act(`/api/jobs/${id}/state`,{state:'done'});if(a==='up'||a==='down'){const rank=Math.max(1,Number(btn.dataset.rank)+(a==='up'?-1:1));return act(`/api/jobs/${id}/rank`,{rank})}if(a==='voice')return;if(a==='send'){const box=document.querySelector(`[data-draft-job="${CSS.escape(id)}"]`);const text=(box?.value||'').trim();if(!text)return;state.drafts.delete(id);if(box)box.value='';state.sentFeedback.set(id,'Invio a Bot-tazzi…');if(state.snapshot)render(state.snapshot);return sendJobText(id,text,text)}});
refresh();refreshHistory();setInterval(()=>{if(!document.querySelector('textarea:focus,input:focus'))refresh()},2500);
</script>
