rules:
- rule_id: eligible_lead_nonprofit_types
  bando_id: fondazione_unipolis_act_2026
  version: 1.0.0
  category: eligibility
  description: Eligible lead applicants are listed nonprofit entities.
  structured_condition:
    applicant_role: lead
  structured_effect:
    field: eligibility_applicant_types
    value: &id001
    - associazioni di volontariato
    - associazioni di promozione sociale
    - associazioni sportive dilettantistiche
    - altri enti del terzo settore
    - cooperative sociali e loro consorzi
    - imprese sociali
  exceptions: []
  source_refs:
  - act_regolamento_2026
  source_sections:
  - 3 Soggetti Ammissibili
  source_pages:
  - 5
  priority: 100
  effective_from: '2026-02-09'
  effective_to: null
  confidence: 1.0
  interpretation_required: false
  blocking: false
  enabled: true
  field: eligibility_applicant_types
  value: *id001
  source_ref: act_regolamento_2026
  document_type: official_call_text
