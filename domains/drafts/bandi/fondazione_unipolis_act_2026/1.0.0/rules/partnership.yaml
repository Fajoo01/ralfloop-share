  document_type: official_call_text
- rule_id: partnership_agreement_required
  bando_id: fondazione_unipolis_act_2026
  version: 1.0.0
  category: partnership
  description: A single partnership agreement signed by all legal representatives
    is required for partnership projects.
  structured_condition:
    has_partnership: true
  structured_effect:
    field: partnership_agreement
    value: required_if_partnership
  exceptions: []
  source_refs:
