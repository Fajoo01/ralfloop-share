- rule_id: one_application_per_organization
  bando_id: fondazione_unipolis_act_2026
  version: 1.0.0
  category: partnership
  description: Same organization cannot participate in more than one application except
    public entities as partners.
  structured_condition:
    organization_role: lead_or_partner
  structured_effect:
    field: partnership_limit
    value: one_application_per_organization
  exceptions: []
