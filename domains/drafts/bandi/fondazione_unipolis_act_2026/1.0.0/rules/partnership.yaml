rules:
- rule_id: partners_must_be_organizations
  bando_id: fondazione_unipolis_act_2026
  version: 1.0.0
  category: partnership
  description: Partners must be constituted organizations, not natural persons or
    informal groups.
  structured_condition:
    partner_type: constituted_organization
  structured_effect:
    field: partnership_partner_type
    value: constituted_organization
  exceptions: []
  source_refs:
