plugins {
    id 'com.android.application'
}

if (!providers.gradleProperty('BOTTAZZI_APP_URL').isPresent()) {
    throw new GradleException('BOTTAZZI_APP_URL must be supplied at build time')
}
def appUrl = providers.gradleProperty('BOTTAZZI_APP_URL').get()

android {
    namespace 'org.tiremminnanz.bottazzi'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.tiremminnanz.gptbrowser'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
        buildConfigField 'String', 'APP_URL', '"' + appUrl.replace('"', '\\"') + '"'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
