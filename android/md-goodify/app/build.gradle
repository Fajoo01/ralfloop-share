plugins {
    id 'com.android.application'
}

if (!providers.gradleProperty('GOODIFY_API_BASE_URL').isPresent()) {
    throw new GradleException('GOODIFY_API_BASE_URL must be supplied at build time')
}
if (!providers.gradleProperty('GOODIFY_API_TOKEN').isPresent() && !providers.gradleProperty('GOODIFY_API_TOKEN_FILE').isPresent()) {
    throw new GradleException('GOODIFY_API_TOKEN or GOODIFY_API_TOKEN_FILE must be supplied at build time')
}
def apiBase = providers.gradleProperty('GOODIFY_API_BASE_URL').get()
def apiToken = providers.gradleProperty('GOODIFY_API_TOKEN').isPresent()
        ? providers.gradleProperty('GOODIFY_API_TOKEN').get()
        : file(providers.gradleProperty('GOODIFY_API_TOKEN_FILE').get()).getText('UTF-8').trim()

android {
    namespace 'org.tiremminnanz.mdgoodify'
    compileSdk 36

    defaultConfig {
        applicationId 'org.tiremminnanz.mdgoodify'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.1.7'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBase.replace('"', '\\"') + '"'
        buildConfigField 'String', 'API_TOKEN', '"' + apiToken.replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
