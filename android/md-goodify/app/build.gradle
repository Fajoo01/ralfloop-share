plugins {
    id 'com.android.application'
}

if (!providers.gradleProperty('GOODIFY_API_BASE_URL').isPresent()) {
    throw new GradleException('GOODIFY_API_BASE_URL must be supplied at build time')
}
def apiBase = providers.gradleProperty('GOODIFY_API_BASE_URL').get()

android {
    namespace 'org.tiremminnanz.mdgoodify'
    compileSdk 36

    defaultConfig {
        applicationId 'org.tiremminnanz.mdgoodify'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBase.replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
